<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>구독 관리</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">SUBSCRIPTION MANAGER</p>
        <h1>구독 관리</h1>
        <p class="page-description">매달 나가는 구독료와 다음 결제일을 한눈에 확인하세요.</p>
      </div>
      <span class="header-mark" aria-hidden="true">₩</span>
    </header>

    <main>
      <section class="summary-grid" aria-label="구독 요약">
        <article class="summary-card summary-primary">
          <p class="summary-label">월 합계</p>
          <p class="summary-value" id="monthly-total">₩0</p>
          <p class="summary-note">연간 구독료는 12개월로 나눈 금액입니다.</p>
        </article>
        <article class="summary-card">
          <p class="summary-label">연간 합계</p>
          <p class="summary-value" id="annual-total">₩0</p>
          <p class="summary-note">월 환산 금액 기준</p>
        </article>
        <article class="summary-card">
          <p class="summary-label">이번 주 결제 예정</p>
          <p class="summary-value" id="upcoming-count">0건</p>
          <p class="summary-note" id="upcoming-total">예정 금액 ₩0</p>
        </article>
      </section>

      <div id="app-message" class="app-message" role="status" aria-live="polite" hidden></div>

      <div class="content-grid">
        <section class="panel subscriptions-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">YOUR SERVICES</p>
              <h2>구독 목록</h2>
            </div>
            <span class="item-count" id="subscription-count">0개</span>
          </div>
          <div id="subscription-list" class="subscription-list"></div>
        </section>

        <div class="side-column">
          <section class="panel form-panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">ADD OR UPDATE</p>
                <h2 id="form-heading">새 구독 추가</h2>
              </div>
            </div>
            <form id="subscription-form">
              <input type="hidden" name="id">
              <label>
                구독 이름
                <input name="name" type="text" maxlength="60" placeholder="예: 넷플릭스" required>
              </label>

              <div class="form-row">
                <label>
                  결제 금액
                  <input name="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="13500" required>
                </label>
                <label>
                  결제 주기
                  <select name="cycle" required>
                    <option value="monthly">매월</option>
                    <option value="yearly">매년</option>
                  </select>
                </label>
              </div>

              <label>
                다음 결제일
                <input name="nextPaymentDate" type="date" required>
              </label>

              <label>
                카테고리
                <input name="category" type="text" maxlength="30" list="category-options" placeholder="예: 영상" required>
                <datalist id="category-options">
                  <option value="영상"></option>
                  <option value="음악"></option>
                  <option value="운동"></option>
                  <option value="생산성"></option>
                  <option value="기타"></option>
                </datalist>
              </label>

              <div class="form-actions">
                <button class="button button-primary" id="submit-button" type="submit">구독 추가</button>
                <button class="button button-secondary" id="cancel-edit" type="button" hidden>취소</button>
              </div>
            </form>
          </section>

          <section class="panel category-panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">MONTHLY BREAKDOWN</p>
                <h2>카테고리별 비중</h2>
              </div>
            </div>
            <div id="category-breakdown" class="category-breakdown"></div>
          </section>
        </div>
      </div>
    </main>
    <footer class="page-footer">구독 데이터는 이 브라우저에 저장됩니다.</footer>
  </div>

  <script src="js/ui.js"></script>
  <script>var testData = [];</script>
  <script src="js/logic.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
